<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="280" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: fetch success — download controls revealed</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field — locked, success ring -->
  <text x="20" y="56" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="62" width="440" height="30" rx="4" fill="#f5f5f5" stroke="#c8e6c9"/>
  <text x="28" y="81" font-size="11" fill="#666">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>
  <!-- ✕ clear button replaces → -->
  <rect x="420" y="66" width="32" height="22" rx="3" fill="#e8e8e8"/>
  <text x="436" y="81" font-size="12" fill="#888" text-anchor="middle">✕</text>

  <!-- Video info card -->
  <rect x="20" y="104" width="440" height="56" rx="6" fill="#fff" stroke="#e8e8e8"/>
  <!-- thumbnail -->
  <rect x="32" y="112" width="64" height="40" rx="3" fill="#c8c8c8"/>
  <text x="64" y="136" font-size="9" fill="#888" text-anchor="middle">img</text>
  <!-- title + duration -->
  <text x="108" y="128" font-size="11" font-weight="bold" fill="#222">Never Gonna Give You Up</text>
  <text x="108" y="148" font-size="10" fill="#aaa">Rick Astley  ·  3:33</text>

  <!-- Format + Quality (2-col) — revealed -->
  <text x="20" y="182" font-size="11" fill="#777">Format</text>
  <rect x="20" y="188" width="200" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="30" y="207" font-size="11" fill="#444">MP3  ▾</text>
  <text x="250" y="182" font-size="11" fill="#777">Quality</text>
  <rect x="250" y="188" width="210" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="260" y="207" font-size="11" fill="#444">Best  ▾</text>

  <!-- Download button — revealed -->
  <rect x="20" y="232" width="440" height="36" rx="6" fill="#222"/>
  <text x="240" y="255" font-size="13" fill="#fff" text-anchor="middle">⬇️  Download</text>

  <text x="240" y="272" font-size="10" fill="#bbb" text-anchor="middle">✕ clears URL and resets to idle · format/quality/button revealed only here</text>
</svg>
