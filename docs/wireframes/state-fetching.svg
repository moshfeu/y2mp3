<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="180" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: fetching info (loading)</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field — filled, non-editable during fetch -->
  <text x="20" y="56" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="62" width="440" height="30" rx="4" fill="#f5f5f5" stroke="#bbb"/>
  <text x="28" y="81" font-size="11" fill="#888">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>
  <!-- Spinner in place of → button -->
  <rect x="420" y="66" width="32" height="22" rx="3" fill="#e8e8e8"/>
  <text x="436" y="81" font-size="13" fill="#555" text-anchor="middle">⟳</text>

  <!-- Skeleton placeholder for title + duration -->
  <rect x="20" y="106" width="240" height="10" rx="3" fill="#e8e8e8"/>
  <rect x="20" y="124" width="100" height="8" rx="3" fill="#f0f0f0"/>

  <text x="240" y="162" font-size="10" fill="#bbb" text-anchor="middle">field locked during fetch · spinner replaces → · skeleton for title/duration</text>
</svg>
