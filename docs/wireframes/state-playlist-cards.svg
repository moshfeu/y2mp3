  <!-- Save location removed note -->
  <text x="20" y="449" font-size="9" fill="#aaa">↑ suggestion #3: save location field removed — configured in Settings</text>

  <!-- Download All button -->
  <rect x="20" y="457" width="440" height="36" rx="6" fill="#222"/>
  <text x="240" y="480" font-size="13" fill="#fff" text-anchor="middle">↓  Download Playlist  (24 videos)</text>
