<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="500" fill="#fafafa" rx="8"/>

  <!-- State label -->
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: playlist preview (card grid)</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL input + Fetch button -->
  <text x="20" y="52" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="58" width="374" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="28" y="77" font-size="11" fill="#444">https://youtube.com/playlist?list=PLxxx</text>
  <rect x="402" y="58" width="58" height="30" rx="4" fill="#222"/>
  <text x="431" y="77" font-size="11" fill="#fff" text-anchor="middle">Fetch</text>
  <text x="20" y="98" font-size="9" fill="#aaa">↑ suggestion #1: explicit Fetch button replaces blur-triggered fetch</text>

  <!-- Playlist header row -->
  <text x="20" y="118" font-size="12" font-weight="bold" fill="#222">My Awesome Playlist</text>
