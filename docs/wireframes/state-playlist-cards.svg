  <rect x="153" y="322" width="62" height="22" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="184" y="337" font-size="10" fill="#555" text-anchor="middle">↓ Save</text>

  <!-- Card 4 -->
  <rect x="245" y="258" width="215" height="104" rx="5" fill="#fff" stroke="#ddd"/>
  <rect x="253" y="266" width="54" height="36" rx="2" fill="#e8e8e8" stroke="#d0d0d0"/>
