  <rect x="378" y="208" width="62" height="22" rx="4" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="409" y="223" font-size="10" fill="#555" text-anchor="middle">↓ Save</text>

  <!-- ─────────────── CARD ROW 2 (y=258) ─────────────── -->

  <!-- Card 3 -->
  <rect x="20" y="258" width="215" height="104" rx="5" fill="#fff" stroke="#ddd"/>
  <rect x="28" y="266" width="54" height="36" rx="2" fill="#e8e8e8" stroke="#d0d0d0"/>
  <text x="55" y="288" font-size="10" fill="#ccc" text-anchor="middle">▶</text>
  <text x="90" y="279" font-size="10" fill="#222">Acoustic Morning</text>
  <text x="90" y="293" font-size="9" fill="#aaa">SoftKeys · 3:08</text>
