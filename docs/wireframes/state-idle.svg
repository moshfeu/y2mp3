<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="160" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: idle (no info fetched)</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field with inline Fetch button -->
  <text x="20" y="56" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="62" width="440" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="28" y="81" font-size="11" fill="#bbb">https://www.youtube.com/watch?v=... or playlist URL</text>
  <!-- Inline fetch button -->
  <rect x="420" y="66" width="32" height="22" rx="3" fill="#e8e8e8"/>
  <text x="436" y="81" font-size="12" fill="#555" text-anchor="middle">→</text>

  <text x="240" y="120" font-size="10" fill="#bbb" text-anchor="middle">Format · Quality · Download button hidden until fetch succeeds</text>
  <text x="240" y="136" font-size="10" fill="#bbb" text-anchor="middle">clipboard auto-paste fires on focus if field is empty</text>
</svg>
