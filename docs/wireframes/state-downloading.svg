<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="470" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: downloading (playlist)</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field (disabled) -->
  <text x="20" y="54" font-size="11" fill="#aaa">YouTube URL</text>
  <rect x="20" y="60" width="440" height="30" rx="4" fill="#f5f5f5" stroke="#e0e0e0"/>
  <text x="28" y="79" font-size="11" fill="#bbb">https://youtube.com/playlist?list=PLxxx</text>

  <!-- Playlist card: header(56) + row1(52) + row2(52) + row3-active(68) + row4(52) = 280 -->
  <rect x="20" y="102" width="440" height="280" rx="6" fill="#fff" stroke="#ddd"/>

  <!-- Card header -->
  <text x="32" y="122" font-size="12" font-weight="bold" fill="#222">My Awesome Playlist</text>
  <text x="32" y="138" font-size="10" fill="#888">24 videos</text>
  <!-- Progress pill -->
  <rect x="388" y="112" width="62" height="20" rx="10" fill="#eee"/>
  <text x="419" y="125" font-size="10" fill="#555" text-anchor="middle">3 / 24</text>
  <!-- Header divider -->
  <line x1="20" y1="158" x2="460" y2="158" stroke="#eee"/>

  <!-- Scrollbar -->
  <rect x="454" y="158" width="4" height="224" rx="2" fill="#f0f0f0"/>
  <rect x="454" y="175" width="4" height="60" rx="2" fill="#ccc"/>

  <!-- Row 1: done -->
  <rect x="28" y="164" width="64" height="40" rx="3" fill="#e8f5e9"/>
  <text x="60" y="188" font-size="9" fill="#4caf50" text-anchor="middle">img</text>
  <text x="100" y="178" font-size="11" fill="#333">Video Title One</text>
  <text x="100" y="193" font-size="10" fill="#aaa">3:24</text>
  <text x="450" y="178" font-size="11" fill="#4caf50" text-anchor="end">✓ Done</text>
  <line x1="20" y1="210" x2="460" y2="210" stroke="#f0f0f0"/>

  <!-- Row 2: done -->
  <rect x="28" y="216" width="64" height="40" rx="3" fill="#e8f5e9"/>
  <text x="60" y="240" font-size="9" fill="#4caf50" text-anchor="middle">img</text>
  <text x="100" y="230" font-size="11" fill="#333">Video Title Two</text>
  <text x="100" y="245" font-size="10" fill="#aaa">4:10</text>
  <text x="450" y="230" font-size="11" fill="#4caf50" text-anchor="end">✓ Done</text>
  <line x1="20" y1="262" x2="460" y2="262" stroke="#f0f0f0"/>

  <!-- Row 3: active — thumbnail tinted blue, inline progress bar -->
  <rect x="28" y="268" width="64" height="40" rx="3" fill="#e3f2fd"/>
  <text x="60" y="292" font-size="9" fill="#1976d2" text-anchor="middle">img</text>
  <text x="100" y="280" font-size="11" font-weight="bold" fill="#111">Video Title Three</text>
  <!-- Inline progress bar -->
  <rect x="100" y="286" width="292" height="5" rx="2" fill="#e0e0e0"/>
  <rect x="100" y="286" width="195" height="5" rx="2" fill="#444"/>
  <text x="450" y="280" font-size="11" fill="#444" text-anchor="end">⟳ 67%</text>
  <line x1="20" y1="330" x2="460" y2="330" stroke="#f0f0f0"/>

  <!-- Row 4: pending -->
  <rect x="28" y="336" width="64" height="40" rx="3" fill="#f5f5f5"/>
  <text x="60" y="360" font-size="9" fill="#ccc" text-anchor="middle">4</text>
  <text x="100" y="350" font-size="11" fill="#aaa">Video Title Four</text>
  <text x="100" y="365" font-size="10" fill="#ccc">2:55</text>
  <text x="450" y="350" font-size="11" fill="#ccc" text-anchor="end">·</text>

  <!-- Buttons: Download (in-progress) + Cancel -->
  <rect x="20" y="396" width="320" height="36" rx="6" fill="#444"/>
  <text x="180" y="419" font-size="12" fill="#fff" text-anchor="middle">Downloading 3 / 24...</text>
  <rect x="350" y="396" width="110" height="36" rx="6" fill="#fff" stroke="#e0e0e0"/>
  <text x="405" y="419" font-size="12" fill="#cc4444" text-anchor="middle">✕ Cancel</text>

  <text x="240" y="455" font-size="10" fill="#bbb" text-anchor="middle">[proposed] per-row progress · cancel button</text>
</svg>
