<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="420" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: choice_prompt (mixed URL)</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field -->
  <text x="20" y="56" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="62" width="440" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="28" y="81" font-size="11" fill="#444">https://youtube.com/watch?v=ABC&amp;list=PL123</text>

  <!-- Choice card -->
  <rect x="20" y="106" width="440" height="90" rx="6" fill="#fff" stroke="#e0b84d" stroke-width="1.5"/>
  <text x="32" y="128" font-size="12" font-weight="bold" fill="#333">This URL contains a playlist.</text>
  <text x="32" y="146" font-size="11" fill="#555">What would you like to download?</text>
  <rect x="32" y="158" width="198" height="28" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="131" y="176" font-size="11" fill="#444" text-anchor="middle">This video only</text>
  <rect x="238" y="158" width="198" height="28" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="337" y="176" font-size="11" fill="#444" text-anchor="middle">Full playlist</text>

  <!-- Format / Quality -->
  <text x="20" y="224" font-size="11" fill="#777">Format</text>
  <rect x="20" y="230" width="210" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="30" y="249" font-size="11" fill="#444">MP3  ▾</text>
  <text x="250" y="224" font-size="11" fill="#777">Quality</text>
  <rect x="250" y="230" width="210" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="260" y="249" font-size="11" fill="#444">Best  ▾</text>

  <!-- Filename -->
  <text x="20" y="284" font-size="11" fill="#777">Filename (optional)</text>
  <rect x="20" y="290" width="440" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="28" y="309" font-size="11" fill="#bbb">Leave blank to use video title</text>

  <!-- Save location -->
  <text x="20" y="344" font-size="11" fill="#777">Save location</text>
  <rect x="20" y="350" width="340" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="28" y="369" font-size="11" fill="#999">/Users/me/Downloads</text>
  <rect x="368" y="350" width="92" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="401" y="369" font-size="11" fill="#555">Browse</text>

  <!-- Download button (disabled) -->
  <rect x="20" y="396" width="440" height="14" rx="4" fill="none"/>
  <text x="240" y="408" font-size="10" fill="#bbb" text-anchor="middle">button disabled until choice is made ↑</text>
</svg>
