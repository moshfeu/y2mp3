<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="300" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">state: mixed URL (v= + list=) — video shown, playlist offered</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field — locked, neutral ring -->
  <text x="20" y="56" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="62" width="440" height="30" rx="4" fill="#f5f5f5" stroke="#c8e6c9"/>
  <text x="28" y="81" font-size="11" fill="#666">https://youtube.com/watch?v=dQw4w9WgXcQ&amp;list=PLxxx</text>
  <rect x="420" y="66" width="32" height="22" rx="3" fill="#e8e8e8"/>
  <text x="436" y="81" font-size="12" fill="#888" text-anchor="middle">✕</text>

  <!-- Video info card -->
  <rect x="20" y="104" width="440" height="56" rx="6" fill="#fff" stroke="#e8e8e8"/>
  <rect x="32" y="112" width="64" height="40" rx="3" fill="#c8c8c8"/>
  <text x="64" y="136" font-size="9" fill="#888" text-anchor="middle">img</text>
  <text x="108" y="128" font-size="11" font-weight="bold" fill="#222">Never Gonna Give You Up</text>
  <text x="108" y="148" font-size="10" fill="#aaa">Rick Astley  ·  3:33</text>

  <!-- Playlist upgrade banner -->
  <rect x="20" y="172" width="440" height="40" rx="6" fill="#fff8e1" stroke="#f0c040"/>
  <text x="32" y="190" font-size="11" fill="#7a5c00">🎵  This video is part of a playlist.</text>
  <rect x="328" y="180" width="122" height="24" rx="4" fill="#f0c040"/>
  <text x="389" y="196" font-size="10" font-weight="bold" fill="#5a3e00" text-anchor="middle">Fetch playlist →</text>

  <!-- Format + Quality + Download button (for the single video) -->
  <text x="20" y="234" font-size="11" fill="#777">Format</text>
  <rect x="20" y="240" width="200" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="30" y="259" font-size="11" fill="#444">MP3  ▾</text>
  <text x="250" y="234" font-size="11" fill="#777">Quality</text>
  <rect x="250" y="240" width="210" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="260" y="259" font-size="11" fill="#444">Best  ▾</text>

  <rect x="20" y="282" width="440" height="0" rx="6" fill="#222"/>

  <text x="240" y="292" font-size="10" fill="#bbb" text-anchor="middle">default: show video + offer playlist upgrade · no forced mode switch</text>
</svg>
