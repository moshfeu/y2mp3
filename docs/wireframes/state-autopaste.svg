<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" font-family="ui-monospace, monospace, sans-serif">
  <rect width="480" height="200" fill="#fafafa" rx="8"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#555">auto-paste: clipboard YouTube URL on app focus</text>
  <line x1="20" y1="32" x2="460" y2="32" stroke="#ddd"/>

  <!-- URL field — populated + fetching spinner -->
  <text x="20" y="56" font-size="11" fill="#777">YouTube URL</text>
  <rect x="20" y="62" width="440" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="28" y="81" font-size="11" fill="#444">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>
  <!-- spinner -->
  <rect x="420" y="66" width="32" height="22" rx="3" fill="#e8e8e8"/>
  <text x="436" y="81" font-size="12" fill="#888" text-anchor="middle">⟳</text>

  <!-- Toast notification — appears below URL field -->
  <rect x="20" y="106" width="440" height="36" rx="6" fill="#1a1a1a" opacity="0.88"/>
  <text x="36" y="128" font-size="11" fill="#fff">📋  YouTube URL pasted from clipboard</text>
  <!-- dismiss x -->
  <text x="444" y="128" font-size="12" fill="#aaa" text-anchor="middle">✕</text>

  <text x="240" y="166" font-size="10" fill="#bbb" text-anchor="middle">toast auto-dismisses after 3s · only fires when URL field is empty</text>
  <text x="240" y="182" font-size="10" fill="#bbb" text-anchor="middle">fetch begins immediately after paste</text>
</svg>
